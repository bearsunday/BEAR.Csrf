name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    # Codecov authenticates the upload with GitHub's OIDC token instead of a stored
    # secret. A secret did not survive the repository transfer, and without one the
    # upload failed silently while the workflow stayed green.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        operating-system:
          - ubuntu-latest
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
        # SessionCsrfToken's coroutine guard has a branch for each answer to "is Swoole
        # loaded?". One leg without the extension keeps the absent branch reachable; with it
        # on every leg, the guard's early return is dead code and coverage never reaches 100%.
        include:
          - php-version: '8.2'
            extensions: ''
          - php-version: '8.3'
            extensions: swoole
          - php-version: '8.4'
            extensions: swoole
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ matrix.extensions }}
          coverage: pcov
          tools: none
          ini-values: assert.exception=1, zend.assertions=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          # codecov.yml demands 100%. A gate whose upload can fail silently is no
          # gate: the transfer disabled it for a month without a red build.
          fail_ci_if_error: true
